<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetGhost</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #d4d8dd;
            line-height: 1.5;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            object-fit: cover;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 12, 0.75);
            z-index: -1;
            pointer-events: none;
        }

        .main-layout {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .content {
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0, 255, 200, 0.3);
        }

        .logo h1 {
            font-family: 'Space Grotesk', monospace;
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #aaffdd, #00ffcc, #33ffaa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(0, 255, 200, 0.4);
            letter-spacing: -0.02em;
        }

        .logo span {
            font-size: 0.75rem;
            color: #88ccbb;
            background: rgba(0, 30, 25, 0.6);
            backdrop-filter: blur(4px);
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            border: 1px solid rgba(0, 255, 200, 0.3);
        }

        .ip-badge {
            background: rgba(10, 18, 20, 0.6);
            backdrop-filter: blur(4px);
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-family: monospace;
            font-size: 0.8rem;
            border: 1px solid #2a6a5a;
            box-shadow: 0 0 6px rgba(0, 255, 200, 0.2);
            color: #88ddcc;
        }

        .top-row {
            display: flex;
            gap: 2rem;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .sidebar-horizontal {
            display: flex;
            gap: 1rem;
            flex-shrink: 0;
        }

        .action-card {
            background: rgba(0, 20, 18, 0.5);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(0, 255, 200, 0.5);
            border-radius: 0.8rem;
            text-align: center;
            padding: 0.9rem 1.2rem;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Space Grotesk', monospace;
            color: #ccffdd;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px rgba(0, 255, 200, 0.2);
        }

        .action-card:hover {
            transform: translateY(-2px);
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.6);
            color: #ffffff;
            text-shadow: 0 0 5px #00ffcc;
            background: rgba(0, 40, 35, 0.7);
        }

        .search-wrapper {
            flex: 1;
            display: flex;
            gap: 1rem;
            min-width: 200px;
        }

        .search-input {
            flex: 1;
            background: rgba(10, 16, 20, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid #2a5a50;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            border-radius: 3rem;
            color: #ccffdd;
            font-weight: 500;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 12px rgba(0, 255, 200, 0.4);
        }

        .ghost-btn {
            background: rgba(0, 20, 18, 0.5);
            backdrop-filter: blur(4px);
            border: 1px solid #00ffcc;
            border-radius: 3rem;
            padding: 0 1.8rem;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: 'Space Grotesk', monospace;
            color: #ccffdd;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ghost-btn:hover {
            background: rgba(0, 255, 200, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.5);
            color: #ffffff;
        }

        .results-section {
            margin-top: 1rem;
        }

        .result-card {
            background: rgba(10, 18, 20, 0.6);
            backdrop-filter: blur(6px);
            border-radius: 1rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            border: 1px solid rgba(0, 255, 200, 0.25);
            transition: all 0.3s ease;
        }

        .result-card:hover {
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.25);
            transform: translateY(-2px);
            background: rgba(10, 25, 28, 0.7);
        }

        .anime-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ddffee;
        }

        .anime-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: #88bbaa;
            flex-wrap: wrap;
            margin-top: 0.3rem;
        }

        .desc-btn {
            background: rgba(0, 30, 25, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid #2a6a5a;
            border-radius: 2rem;
            padding: 0.4rem 1.2rem;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
            color: #bbffdd;
            transition: all 0.2s;
        }

        .desc-btn:hover {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 200, 0.4);
            color: white;
        }

        .desc-text {
            margin-top: 0.8rem;
            padding: 0.8rem;
            background: rgba(7, 16, 18, 0.8);
            border-radius: 1rem;
            font-size: 0.8rem;
            line-height: 1.4;
            display: none;
            border-left: 3px solid #00ffcc;
            color: #bbddcc;
        }

        .footer-motto {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.7rem;
            color: #6a9988;
            border-top: 1px solid rgba(0, 255, 200, 0.2);
            padding-top: 1.5rem;
        }

        .loading, .error-msg {
            text-align: center;
            padding: 2rem;
            color: #88ccbb;
        }

        .error-msg {
            color: #ff8866;
        }

        @media (max-width: 700px) {
            .top-row {
                flex-direction: column;
                align-items: stretch;
            }
            .sidebar-horizontal {
                justify-content: center;
            }
            body {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <video class="video-background" autoplay muted loop playsinline>
        <source src="/static/fon1.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="main-layout">
        <div class="content">
            <div class="header">
                <div class="logo">
                    <h1>NETGHOST</h1>
                    <span>сетевой призрак аниме</span>
                </div>
                <div class="ip-badge" id="ipDisplay">загрузка...</div>
            </div>

            <div class="top-row">
                <div class="sidebar-horizontal">
                    <div class="action-card" id="topSeasonBtn">ТОП СЕЗОНА</div>
                    <div class="action-card" id="randomAnimeBtn">СЛУЧАЙНОЕ</div>
                </div>
                <div class="search-wrapper">
                    <input type="text" class="search-input" id="animeQuery" placeholder="например: Steins Gate, Frieren, Naruto..." autocomplete="off">
                    <button class="ghost-btn" id="searchBtn">РАЗВЕДКА</button>
                </div>
            </div>

            <div class="results-section" id="resultsContainer">
                <div style="text-align: center; padding: 2rem; color: #88ccbb;">готов к сканированию... выбери действие</div>
            </div>

            <div class="footer-motto">
                сетевой призрак в сети
            </div>
        </div>
    </div>

    <script>
        let currentIP = 'загрузка...';

        async function getClientIP() {
            try {
                const resp = await fetch('https://api.ipify.org?format=json');
                const data = await resp.json();
                currentIP = data.ip;
                document.getElementById('ipDisplay').innerText = currentIP;
            } catch (err) {
                currentIP = '127.0.0.1';
                document.getElementById('ipDisplay').innerText = currentIP;
            }
        }

        function showLoading() {
            document.getElementById('resultsContainer').innerHTML = '<div class="loading">сканирование сети...</div>';
        }

        function showError(msg) {
            document.getElementById('resultsContainer').innerHTML = `<div class="error-msg">${msg}</div>`;
        }

        async function search() {
            const query = document.getElementById('animeQuery').value;
            if (!query) return;
            showLoading();
            try {
                const resp = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await resp.json();
                if (data.success && data.data.length > 0) {
                    displayResults(data.data, `результаты поиска: ${query}`);
                } else {
                    showError('ничего не найдено');
                }
            } catch (err) {
                showError('ошибка поиска');
            }
        }

        async function loadTop() {
            showLoading();
            try {
                const resp = await fetch('/api/top');
                const data = await resp.json();
                if (data.success && data.data.length > 0) {
                    displayResults(data.data, 'топ текущего сезона');
                } else {
                    showError('не удалось загрузить топ');
                }
            } catch (err) {
                showError('ошибка загрузки топа');
            }
        }

        async function loadRandom() {
            showLoading();
            try {
                const resp = await fetch('/api/random');
                const data = await resp.json();
                if (data.success && data.data) {
                    displayResults([data.data], 'случайное аниме');
                } else {
                    showError('не удалось загрузить');
                }
            } catch (err) {
                showError('ошибка загрузки');
            }
        }

        async function loadDescription(title, btn) {
            btn.disabled = true;
            btn.textContent = 'загрузка...';
            
            const card = btn.closest('.result-card');
            let descDiv = card.querySelector('.desc-text');
            if (!descDiv) {
                descDiv = document.createElement('div');
                descDiv.className = 'desc-text';
                card.appendChild(descDiv);
            }
            
            try {
                const resp = await fetch(`/api/description?title=${encodeURIComponent(title)}`);
                const data = await resp.json();
                if (data.success) {
                    descDiv.innerHTML = data.description;
                } else {
                    descDiv.innerHTML = 'описание не найдено';
                }
                descDiv.style.display = 'block';
            } catch (err) {
                descDiv.innerHTML = 'ошибка получения описания';
                descDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'получить описание';
            }
        }

        function displayResults(animeList, title) {
            if (!animeList || animeList.length === 0) {
                document.getElementById('resultsContainer').innerHTML = '<div class="error-msg">ничего не найдено</div>';
                return;
            }
            
            let html = `<div style="margin-bottom:1rem; font-weight:600; color:#aaffdd;">${title}</div>`;
            for (let anime of animeList) {
                const safeTitle = (anime.title || '').replace(/'/g, "\\'");
                const score = anime.score || 'Нет';
                const episodes = anime.episodes || '?';
                let genres = 'не указаны';
                if (anime.genres && anime.genres.length > 0) {
                    genres = anime.genres.slice(0, 3).map(g => g.name).join(', ');
                }
                
                html += `
                    <div class="result-card">
                        <div style="flex:2">
                            <div class="anime-title">${anime.title || 'Без названия'}</div>
                            <div class="anime-meta">
                                <span>рейтинг: ${score}</span>
                                <span>эпизодов: ${episodes}</span>
                                <span>жанры: ${genres}</span>
                            </div>
                        </div>
                        <button class="desc-btn" onclick="loadDescription('${safeTitle}', this)">получить описание</button>
                    </div>
                `;
            }
            document.getElementById('resultsContainer').innerHTML = html;
        }

        document.getElementById('searchBtn').addEventListener('click', search);
        document.getElementById('topSeasonBtn').addEventListener('click', loadTop);
        document.getElementById('randomAnimeBtn').addEventListener('click', loadRandom);
        document.getElementById('animeQuery').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') search();
        });

        getClientIP();
        loadTop();
    </script>
</body>
</html>
